[package]
name = "git-it"
version = "0.1.0"
description = "A fast, native macOS git client with first-class commit-time editing"
authors = ["Ashutosh Shah"]
edition = "2021"

[lib]
name = "git_it_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
tauri-plugin-store = "2.4.3"
# Filesystem watcher for live "Local Changes" updates (see fswatch.rs).
notify = "6"
