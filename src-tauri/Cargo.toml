[package]
name = "git-it"
version = "0.1.0"
description = "A fast, native macOS git client with first-class commit-time editing"
authors = ["Ashutosh Shah"]
edition = "2021"

[lib]
name = "git_it_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
git-core = { path = "../crates/git-core" }
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
tauri-plugin-store = "2.4.3"
# Filesystem watcher for live "Local Changes" updates (see fswatch.rs).
notify = "6"
# macOS LaunchServices lookup for the "Open With" file menu (see openwith.rs).
objc2-app-kit = { version = "0.3", features = ["NSWorkspace"] }
objc2-foundation = { version = "0.3", features = ["NSString", "NSURL", "NSArray", "NSFileManager"] }

# Auto-updater is a desktop-only concern (no mobile targets today, but this
# mirrors the Tauri convention and keeps any future mobile build clean).
# `semver` compares the beta and stable manifest versions in the updater's
# superset check (see src/updater.rs).
[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
semver = "1"
