[package]
name = "git-it-agent"
version = "0.1.0"
edition = "2021"
description = "Headless Git It agent — drives git-core on this machine"

[lib]
name = "git_it_agent"
path = "src/lib.rs"

[[bin]]
name = "git-it-agent"
path = "src/main.rs"

[dependencies]
git-core = { path = "../git-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
convex = "0.10"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
dotenvy = "0.15"
anyhow = "1"
# Agent auth: claim a pairing code + refresh the session token over HTTP.
# rustls-tls avoids a system OpenSSL dependency (keeps the headless build clean).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Phase 2b E2E crypto: HPKE base mode (DHKEM-X25519/HKDF-SHA256/ChaCha20-Poly1305)
# + Ed25519 sender signatures + deterministic CBOR envelope. Keeps 0 Tauri deps.
hpke = { version = "0.13", default-features = false, features = ["x25519", "alloc"] }
ed25519-dalek = "2"
ciborium = "0.2"
base64 = "0.22"
# Must be the SAME rand_core major that hpke 0.13 re-exports (0.9) so its OsRng
# satisfies hpke's `CryptoRng + RngCore` bound; `os_rng` provides OsRng.
rand_core = { version = "0.9", features = ["os_rng"] }

[dev-dependencies]
# KAT vector (hex) encode/decode for the Swift↔Rust interop harness.
hex = "0.4"
