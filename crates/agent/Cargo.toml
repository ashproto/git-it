[package]
name = "git-it-agent"
version = "0.1.0"
edition = "2021"
description = "Headless Git It agent — drives git-core on this machine"

[lib]
name = "git_it_agent"
path = "src/lib.rs"

[[bin]]
name = "git-it-agent"
path = "src/main.rs"

[dependencies]
git-core = { path = "../git-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
convex = "0.10"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
dotenvy = "0.15"
anyhow = "1"
