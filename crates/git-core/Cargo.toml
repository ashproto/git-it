[package]
name = "git-core"
version = "0.1.0"
edition = "2021"
description = "Tauri-free git logic shared by the Git It desktop app and the headless agent"

[lib]
name = "git_core"
crate-type = ["rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
